services:
  hubminimalwp:
    image: hubminimalwp:latest
    build: .
    container_name: HubMinimalWp
    restart: unless-stopped
    environment:
      PORT: "3000"
      API_KEY: ${API_KEY:-}
    volumes:
      - /datastore/hubminimal/data:/app/data
    networks:
      - edge
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=edge'
      - 'traefik.http.routers.wa.rule=Host(`wa.octotech.az`)'
      - 'traefik.http.routers.wa.entrypoints=websecure'
      - 'traefik.http.routers.wa.tls=true'
      - 'traefik.http.routers.wa.priority=100'
      - 'traefik.http.services.wa.loadbalancer.server.port=3000'

  # Opsiyonel: Cloudflare Tunnel (Traefik 443 yerine)
  # docker compose --profile tunnel up -d
  # TUNNEL_TOKEN + Zero Trust: wa.octotech.az → http://hubminimalwp:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wa-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - edge
    depends_on:
      - hubminimalwp
    profiles:
      - tunnel

networks:
  edge:
    name: edge
    driver: bridge
